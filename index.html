            align-items: center;

            border: none;
            cursor: pointer;

            background: #0984e3;
            color: white;

            height: 40px;

            cursor: pointer;

        }

            min-height: 50px;
            flex-wrap: wrap;

            justify-content: center;

            font-weight: bold;

    <audio id="fallback-audio" preload="none"></audio>

        // ===== 语音能力检测 =====
        const hasSpeechSynth = 'speechSynthesis' in window;
        const fallbackAudio = document.getElementById('fallback-audio');
        let speechUnlocked = false;

        // ===== 开始学习 =====
        function startLearning() {
            // 隐藏遮罩
            document.getElementById('start-screen').style.display = 'none';

            if (hasSpeechSynth) {
                // 尝试用极短语音解锁
                const u = new SpeechSynthesisUtterance('a');
                u.volume = 0.01;
                u.rate = 3.0;
                u.onstart = () => { speechUnlocked = true; };
                u.onerror = () => {}; // 静默失败，不影响
                window.speechSynthesis.speak(u);
            }

            // 延迟初始化，确保解锁完成
            setTimeout(() => {
                init();
            }, 200);
        }

        // ===== 播放音频（自动降级核心）=====
        function playAudio() {
            if (!currentItem) return;

            const text = currentMode === 'word' ? currentItem.word : currentItem.sentence;

            if (hasSpeechSynth && speechUnlocked) {
                // 优先用原生 TTS
                try {
                    window.speechSynthesis.cancel();
                } catch(e) {}
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.8;
                u.pitch = 1.0;
                u.volume = 1.0;
                u.onerror = () => {
                    // 如果原生失败，降级到音频
                    playFallback(text);
                };
                window.speechSynthesis.speak(u);
            } else {
                // 降级：用有道 TTS 音频接口
                playFallback(text);
            }
        }

        // 有道 TTS 音频播放（微信/Via 全兼容）
        function playFallback(text) {
            // type=2 是美音，type=1 是英音
            const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
            fallbackAudio.src = url;
            fallbackAudio.play().catch(e => {
                // 如果自动播放被拦截，提示用户

        let currentUnitIndex = 0;
        let currentWordIndex = 0;
        let currentMode = 'word';
        let currentWordList = [];
        let userAnswer = [];
        let sourcePool = [];
        let currentItem = null;

        const elBadge = document.getElementById('mode-badge');
        const elCn = document.getElementById('cn-text');
        const elSlots = document.getElementById('slots-area');
        const elOptions = document.getElementById('options-area');
        const elMsg = document.getElementById('msg-area');
        const btnNext = document.getElementById('btn-next');

        function init() {
            loadUnitList();
            currentWordList = unitData[0].words;
            loadLevel();
        }

        function loadUnitList() {
            elBadge.innerHTML = '<option value="0">📖 选择单元</option>';
            unitData.forEach((unit, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = unit.unit;
                elBadge.appendChild(option);
            });
        }

        function onUnitChange(value) {
            currentUnitIndex = parseInt(value);
            currentWordIndex = 0;
            currentMode = 'word';
            currentWordList = unitData[currentUnitIndex].words;
            loadLevel();
        }

        function lockContainerHeight() {
            elSlots.style.height = elSlots.offsetHeight + 'px';
            elOptions.style.height = elOptions.offsetHeight + 'px';
            elSlots.classList.add('locked');
            elOptions.classList.add('locked');
        }

        function unlockContainerHeight() {
            requestAnimationFrame(() => {
                elSlots.style.height = '';
                elOptions.style.height = '';
                elSlots.classList.remove('locked');
                elOptions.classList.remove('locked');
            });
        }

        function loadLevel() {
            if (currentWordIndex >= currentWordList.length) {
                currentWordIndex = 0;
                alert("恭喜！本单元所有单词都练习完啦，重新开始！");
            }
            
            currentItem = currentWordList[currentWordIndex];
            
            lockContainerHeight();
            
            if (currentMode === 'word') {
                setupWordMode();
            } else {
                setupSentenceMode();
            }
            
            unlockContainerHeight();
        }

        function setupWordMode() {
            elBadge.style.background = '#6c5ce7';
            elCn.textContent = currentItem.cn;
            
            userAnswer = [];
            const letters = currentItem.word.split('').map((char, i) => ({ char, id: i }));
            sourcePool = [...letters].sort(() => Math.random() - 0.5);
            
            renderWordUI();
            playAudio();
            
            btnNext.style.display = 'none';
            elMsg.textContent = '';
        }

        function renderWordUI() {
            elSlots.innerHTML = '';
            elOptions.innerHTML = '';

            for(let i=0; i<currentItem.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                if(userAnswer[i]) {
                    slot.textContent = userAnswer[i].char.toUpperCase();
                    slot.className += ' filled';
                    slot.onclick = () => removeLetter(i);
                }
                elSlots.appendChild(slot);
            }

            sourcePool.forEach(item => {
                const isUsed = userAnswer.some(u => u.id === item.id);
                const btn = document.createElement('div');
                btn.className = `letter-btn ${isUsed ? 'used' : ''}`;
                btn.textContent = item.char.toUpperCase();
                if(!isUsed) {
                    btn.onclick = () => addLetter(item);
                }
                elOptions.appendChild(btn);
            });
        }

        function addLetter(item) {
            userAnswer.push(item);
            renderWordUI();
            checkWordAnswer();
        }

        function removeLetter(index) {
            userAnswer.splice(index, 1);
            renderWordUI();
            elMsg.textContent = '';
        }

        function checkWordAnswer() {
            const currentStr = userAnswer.map(u => u.char).join('');
            if(currentStr.length === currentItem.word.length) {
                if(currentStr.toLowerCase() === currentItem.word.toLowerCase()) {
                    handleSuccess("单词拼对啦！");
                } else {
                    elMsg.textContent = "不对哦，再试试";
                    elMsg.className = "status-msg error";
                }
            }
        }

        function setupSentenceMode() {
            elBadge.style.background = '#e17055';
            elCn.textContent = currentItem.sentenceCn;
            
            userAnswer = [];
            const words = currentItem.sentence.split(' ');
            sourcePool = words.map((w, i) => ({ text: w, id: i }));
            sourcePool.sort(() => Math.random() - 0.5);
            
            renderSentenceUI();
            playAudio();

            btnNext.style.display = 'none';
            elMsg.textContent = '';
        }

        function renderSentenceUI() {
            elSlots.innerHTML = '';
            elOptions.innerHTML = '';

            const targetLen = currentItem.sentence.split(' ').length;

            for(let i=0; i<targetLen; i++) {
                const slot = document.createElement('div');
                slot.className = 'word-slot';
                if(userAnswer[i]) {
                    slot.textContent = userAnswer[i].text;
                    slot.className += ' filled';
                    slot.onclick = () => removeWord(i);
                }
                elSlots.appendChild(slot);
            }

            sourcePool.forEach(item => {
                const isUsed = userAnswer.some(u => u.id === item.id);
                const btn = document.createElement('div');
                btn.className = `word-btn ${isUsed ? 'used' : ''}`;
                btn.textContent = item.text;
                if(!isUsed) {
                    btn.onclick = () => addWord(item);
                }
                elOptions.appendChild(btn);
            });
        }

        function addWord(item) {
            userAnswer.push(item);
            renderSentenceUI();
            checkSentenceAnswer();
        }

        function removeWord(index) {
            userAnswer.splice(index, 1);
            renderSentenceUI();
            elMsg.textContent = '';
        }

        function checkSentenceAnswer() {
            const targetArr = currentItem.sentence.split(' ');
            if(userAnswer.length === targetArr.length) {
                const currentStr = userAnswer.map(u => u.text).join(' ');
                if(currentStr === currentItem.sentence) {
                    handleSuccess("句子组对啦！太棒了！");
                } else {
                    elMsg.textContent = "顺序不对哦";
                    elMsg.className = "status-msg error";
                }
            }
        }

        function handleSuccess(text) {
            elMsg.textContent = text;
            elMsg.className = "status-msg success";
            btnNext.style.display = 'block';
            triggerConfetti();
            playAudio();
        }

        function nextStageOrWord() {
            if (currentMode === 'word') {
                currentMode = 'sentence';
                loadLevel();
            } else {
                currentMode = 'word';
                currentWordIndex++;
                if(currentWordIndex >= currentWordList.length) {
                    currentWordIndex = 0;
                    alert("恭喜！本单元所有单词都练习完啦，重新开始！");
                }
                loadLevel();
            }
        }

        function triggerConfetti() {
            const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7'];
            for(let i=0; i<20; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random()*100 + '%';
                c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                c.style.animationDuration = (Math.random()*1 + 1) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 2000);
            }
        }
    </script>
